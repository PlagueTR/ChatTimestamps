plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'java-library'
	id 'java'
}

base{
    archivesName = project.archives_base_name
}
version = "${project.mod_version}+${project.mc_version}"
group = project.maven_group

repositories {
	mavenCentral()
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	//implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Deprecated Fabric API modules
	//modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

	implementation ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude module: "fabric-api"
	}

	implementation ("com.terraformersmc:modmenu:${project.modmenu_version}") {
		exclude module: "fabric-api"
		transitive = false
	}

}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
	withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

def archivesNameCached = base.archivesName.get()

jar {
	from("LICENSE") {
		rename { "${it}_${archivesNameCached}"}
	}
}
